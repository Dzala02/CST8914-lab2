    <style>
        .button {
            background-color: #81C784; /* black on #81C784 = 10.44:1 (passes AA & AAA) */

            text-align: center;
            text-decoration: none;
            display: inline-block;

            margin: 4px 2px;

                outline: 3px solid #ffffff;
                outline-offset: 3px;
            }

            padding: 20px;
            background-color: #2f2f2f;
        }

            color: #ffffff; /* white on #2f2f2f = 13.39:1 */
        }
